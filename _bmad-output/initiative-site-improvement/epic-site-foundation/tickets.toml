type = "story"
title = "Shared components: button, page banner, breadcrumb, section links"
description = "Builds the components used on nearly every page: primary and secondary Button, Page banner with its Breadcrumb, and the 'Dans la rubrique' section links, both reading the menu-position helper of story 9, shown together on a preview-only component page."
verify = "On the preview component page at 360 px and 1440 px, each component shows the same elements and colours as its board in design/source/components/, the axe-core check passes, and the page is absent from the production build and its sitemap."
