<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>@@TITLE@@</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style>
body{margin:0;background:[[surface-white]]}
a{color:[[primary]]}a:hover{color:[[primary-hover]]}
a:focus-visible,button:focus-visible{outline:3px solid [[secondary]];outline-offset:3px;border-radius:4px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:[[surface-white]]}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}details[open] .chevron{transform:rotate(180deg)}
h1,h2,h3,h4{font-weight:600;letter-spacing:-0.03em}
.anchor-nav .anchor-label{opacity:0;transition:opacity .15s}.anchor-nav a:hover .anchor-label,.anchor-nav a:focus-visible .anchor-label{opacity:1}
</style>
</helmet>
<div style="position: relative; width: @@W@@px; height: @@H@@px; overflow: hidden; background: [[surface-white]]">

  <header style="position: sticky; top: 0; z-index: 20; box-sizing: border-box; height: {{ hdrH }}; background: [[surface-white]]; border-bottom: 1px solid [[border]]; box-shadow: {{ hdrShadow }}; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: height 0.2s, box-shadow 0.2s">

    <button type="button" aria-label="Ouvrir le menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 1px solid [[border]]; border-radius: 4px; background: [[surface-white]]; color: [[secondary]]; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>Menu</button>
  </header>
  @@PAGES@@

  </div>
  <!-- touch screens: a floating "on this page" button opens the list of home sections -->
  <sc-if value="{{ showSheetBtn }}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-expanded="{{ sheetExpanded }}" aria-label="Sur cette page : {{ anchorLabel }}" onClick="{{ toggleSheet }}" style="position: absolute; right: 16px; bottom: 24px; z-index: 30; display: inline-flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); min-height: 52px; padding: 0 18px; border: 0; border-radius: 999px; background: [[secondary]]; color: [[surface-white]]; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(21, 39, 61, 0.25)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="18" x2="20" y2="18"></line><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ anchorLabel }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"></polyline></svg></button>
  </sc-if>
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; z-index: 44; background: rgba(21, 39, 61, 0.35)"></div>
      <div role="dialog" aria-modal="true" aria-label="Aller à une section" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 45; box-sizing: border-box; padding: 12px 20px 28px; border-radius: 16px 16px 0 0; background: [[surface-white]]; font-family: 'Inter Tight', system-ui, sans-serif; line-height: 1.6">
        <span aria-hidden="true" style="display: block; width: 40px; height: 4px; margin: 0 auto 16px; border-radius: 2px; background: [[border]]"></span>
        <p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: [[text]]">Sur cette page</p>
        <nav aria-label="Sections de la page">
          <a href="#" onClick="{{ jumpAccueil }}" aria-current="{{ aAccueilCur }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; border-bottom: 1px solid [[border]]; font-size: 18px; font-weight: {{ aAccueilW }}; color: {{ aAccueilC }}; text-decoration: none"><span aria-hidden="true" style="flex: none; visibility: {{ aAccueilVis }}; width: 8px; height: 8px; border-radius: 999px; background: [[accent]]"></span>Haut de page</a>
          <a href="#" onClick="{{ jumpBienvenue }}" aria-current="{{ aBienvenueCur }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; border-bottom: 1px solid [[border]]; font-size: 18px; font-weight: {{ aBienvenueW }}; color: {{ aBienvenueC }}; text-decoration: none"><span aria-hidden="true" style="flex: none; visibility: {{ aBienvenueVis }}; width: 8px; height: 8px; border-radius: 999px; background: [[accent]]"></span>Bienvenue</a>
          <a href="#" onClick="{{ jumpEvenements }}" aria-current="{{ aEvenementsCur }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; border-bottom: 1px solid [[border]]; font-size: 18px; font-weight: {{ aEvenementsW }}; color: {{ aEvenementsC }}; text-decoration: none"><span aria-hidden="true" style="flex: none; visibility: {{ aEvenementsVis }}; width: 8px; height: 8px; border-radius: 999px; background: [[accent]]"></span>Les évènements</a>
          <a href="#" onClick="{{ jumpPredication }}" aria-current="{{ aPredicationCur }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; border-bottom: 1px solid [[border]]; font-size: 18px; font-weight: {{ aPredicationW }}; color: {{ aPredicationC }}; text-decoration: none"><span aria-hidden="true" style="flex: none; visibility: {{ aPredicationVis }}; width: 8px; height: 8px; border-radius: 999px; background: [[accent]]"></span>{{ aPredicationLabel }}</a>
        </nav>
      </div>
  </sc-if>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Menu" style="position: absolute; inset: 0; z-index: 40; overflow-y: auto; box-sizing: border-box; padding: 8px 24px 32px; background: [[surface-white]]; color: [[secondary]]; font-family: 'Inter Tight', system-ui, sans-serif; line-height: 1.6">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px">
        <img src="/_blob/513278200da79a2601d13dcd3ae8d93d" alt="Église Évangélique de Valenciennes" style="height: 44px; width: auto">
        <button type="button" aria-label="Fermer le menu" onClick="{{ toggleMenu }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 1px solid [[border]]; border-radius: 4px; background: [[surface-white]]; color: [[secondary]]; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>Fermer</button>
      </div>
      <nav aria-label="Menu principal" style="display: flex; flex-direction: column; gap: 4px; max-width: 560px">
        <a href="#" onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: {{ homeColor }}; text-decoration: none; font-size: 20px; font-weight: {{ homeWeight }}"><span aria-hidden="true" style="flex: none; display: {{ homeDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Accueil</a>
        <p style="display: flex; align-items: center; gap: 10px; margin: 8px 0 0; font-size: 20px; font-weight: {{ churchWeight }}; color: {{ churchColor }}"><span aria-hidden="true" style="flex: none; display: {{ churchDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>L'église</p>
        <a href="#" onClick="{{ goQui }}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding-left: 16px; border-left: 2px solid [[border]]; color: {{ quiColor }}; text-decoration: none; font-size: 18px; font-weight: {{ quiWeight }}"><span aria-hidden="true" style="flex: none; display: {{ quiDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Qui sommes-nous ?</a>
        <a href="#" onClick="{{ goEquipe }}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding-left: 16px; border-left: 2px solid [[border]]; color: {{ equipeColor }}; text-decoration: none; font-size: 18px; font-weight: {{ equipeWeight }}"><span aria-hidden="true" style="flex: none; display: {{ equipeDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>L'équipe</a>
        <a href="#" onClick="{{ goHistoire }}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding-left: 16px; border-left: 2px solid [[border]]; color: {{ histoireColor }}; text-decoration: none; font-size: 18px; font-weight: {{ histoireWeight }}"><span aria-hidden="true" style="flex: none; display: {{ histoireDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Notre histoire</a>
        <a href="#" onClick="{{ goEvenements }}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; margin-top: 8px; color: {{ evColor }}; text-decoration: none; font-size: 20px; font-weight: {{ evWeight }}"><span aria-hidden="true" style="flex: none; display: {{ evDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Évènements</a>
        <a href="#" onClick="{{ goPredications }}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: {{ prColor }}; text-decoration: none; font-size: 20px; font-weight: {{ prWeight }}"><span aria-hidden="true" style="flex: none; display: {{ prDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Prédications</a>
        <a href="#" onClick="{{ goContact }}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: {{ ctColor }}; text-decoration: none; font-size: 20px; font-weight: {{ ctWeight }}"><span aria-hidden="true" style="flex: none; display: {{ ctDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Nous contacter</a>
        <a href="#" onClick="{{ goDon }}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 16px; border-radius: 4px; background: [[primary]]; color: [[surface-white]]; font-weight: 600; text-decoration: none">Faire un don</a>
      </nav>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sermonBlock":{"editor":"enum","options":["La dernière prédication","En direct (pendant la diffusion YouTube)"],"default":"La dernière prédication","section":"États des pages"},"eventsBlock":{"editor":"enum","options":["Des évènements à venir","Aucun évènement à venir"],"default":"Des évènements à venir","section":"États des pages"},"$preview":{"width":@@W@@,"height":@@H@@}}'>
const VALUES = [{"title": "La Bible, Parole de Dieu", "text": "Dans la Bible, toute entière, comme la Parole inspirée et infaillible de Dieu."}, {"title": "Un seul Dieu, créateur", "text": "Dans le Dieu unique et Éternel, créateur de l'univers et de l'homme."}, {"title": "Jésus-Christ", "text": "En Jésus-Christ, dans sa naissance miraculeuse, dans sa vie sans péché, dans ses miracles, dans sa mort volontaire pour tous les hommes, dans sa résurrection corporelle, dans son ascension à la droite du Père, dans son retour prochain et dans sa divinité."}, {"title": "Le salut par la foi", "text": "Dans la nature pécheresse de l'homme, mais l'accès au Salut et au pardon, en Jésus seul, et par la foi."}, {"title": "La nouvelle naissance", "text": "Dans la nouvelle naissance opérée par le Saint-Esprit : elle conduit les croyants dans un amour plus grand pour Dieu, un attachement à la Bible, et à mener une vie digne de Jésus-Christ."}, {"title": "La guérison divine", "text": "Dans la guérison divine, offerte à travers l'œuvre de Christ à la Croix."}, {"title": "Le baptême et les dons du Saint-Esprit", "text": "Dans le baptême et les dons du Saint-Esprit (la Bible, livre des Actes des Apôtres, chapitre 2, verset 4), donnés aux croyants qui le demandent, dans le but de servir efficacement Dieu et de témoigner de son nom dans notre monde."}, {"title": "L'Église", "text": "Dans l'Église de Jésus-Christ, non comme un bâtiment ou une institution religieuse, mais comme le rassemblement des croyants autour de leur foi et de leur attachement à Jésus."}, {"title": "Le baptême et la Sainte Cène", "text": "Dans la pratique de deux ordonnances chrétiennes : le baptême par immersion des adultes, signe public d'une conversion véritable et d'un engagement envers Jésus ; la Sainte Cène, ou repas du Seigneur, par lequel le croyant commémore la mort de Jésus-Christ, sa victoire absolue sur la mort et son retour prochain."}];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 'home', menuOpen: false, dropOpen: false, openValue: 0, scrolled: false, anchor: 'accueil', flash: false, sheetOpen: false };
  }
  renderVals() {
    const s = this.state;
    const live = (this.props.sermonBlock ?? 'La dernière prédication') !== 'La dernière prédication';
    const hasEvents = (this.props.eventsBlock ?? 'Des évènements à venir') === 'Des évènements à venir';
    const go = (page) => (e) => {
      if (e && e.preventDefault) e.preventDefault();
      this.setState({ page: page, menuOpen: false, dropOpen: false, scrolled: false, anchor: 'accueil', sheetOpen: false });
      if (this.vp) this.vp.scrollTop = 0;
    };
    const church = ['qui', 'equipe', 'histoire'].indexOf(s.page) >= 0;
    const on = (pages, active, idle) => pages.indexOf(s.page) >= 0 ? active : idle;
    // current section: night blue, semibold, gold dot before; the others muted
    const sect = (pages) => ({ color: on(pages, '[[secondary]]', '[[text-muted]]'), weight: on(pages, '600', '500'), dot: on(pages, 'inline-block', 'none') });
    const home = sect(['home']), chu = sect(['qui', 'equipe', 'histoire']), qui = sect(['qui']), equ = sect(['equipe']), his = sect(['histoire']);
    const ev = sect(['evenements', 'evenement']), pr = sect(['predications', 'predication']), ct = sect(['contact']), dn = sect(['don']);
    const sc = s.scrolled;
    // smooth scroll to a home section, below the compact header
    // slow eased scroll (1 s); the computer home moves section by section with the wheel
    const HC = 67;
    const target = (k) => { const vp = this.vp, el = vp && vp.querySelector('#home-' + k); return el ? (k === 'accueil' ? 0 : el.getBoundingClientRect().top - vp.getBoundingClientRect().top + vp.scrollTop - HC) : null; };
    const glide = (to) => {
      const vp = this.vp; if (!vp) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const from = vp.scrollTop, d = to - from, dur = reduce ? 0 : 1000, t0 = performance.now();
      this._anim = true;
      const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const step = (now) => { const x = dur ? Math.min(1, (now - t0) / dur) : 1; vp.scrollTop = from + d * ease(x); if (x < 1) requestAnimationFrame(step); else { this._anim = false; this._cool = Date.now() + 300; } };
      requestAnimationFrame(step);
    };
    const jump = (k) => (e) => { if (e && e.preventDefault) e.preventDefault(); if (s.sheetOpen) this.setState({ sheetOpen: false }); const t = target(k); if (t !== null) glide(t); };
    const LABELS = { accueil: 'Haut de page', bienvenue: 'Bienvenue', evenements: 'Les évènements', predication: live ? 'En ce moment' : 'La dernière prédication' };
    const values = VALUES.map((v, i) => ({
      n: i + 1,
      title: v.title,
      text: v.text,
      open: s.openValue === i,
      expanded: s.openValue === i ? 'true' : 'false',
      rot: s.openValue === i ? 'rotate(180deg)' : 'none',
      toggle: () => this.setState({ openValue: s.openValue === i ? -1 : i })
    }));
    return {
      hasEvents: hasEvents, noEvents: !hasEvents, live: live, notLive: !live,
      isHome: s.page === 'home',
      isQui: s.page === 'qui',
      isEquipe: s.page === 'equipe',
      isHistoire: s.page === 'histoire',
      isEvenements: s.page === 'evenements',
      isEvenement: s.page === 'evenement',
      isPredications: s.page === 'predications',
      isPredication: s.page === 'predication',
      isContact: s.page === 'contact',
      isDon: s.page === 'don',
      isEntretien: s.page === 'entretien',
      isPriere: s.page === 'priere',
      isServir: s.page === 'servir',
      isDonnees: s.page === 'donnees',
      isConditions: s.page === 'conditions',
      isMentions: s.page === 'mentions',
      goHome: go('home'),
      goQui: go('qui'),
      goEquipe: go('equipe'),
      goHistoire: go('histoire'),
      goEvenements: go('evenements'),
      goEvenement: go('evenement'),
      goPredications: go('predications'),
      goPredication: go('predication'),
      goContact: go('contact'),
      goDon: go('don'),
      goEntretien: go('entretien'),
      goPriere: go('priere'),
      goServir: go('servir'),
      goDonnees: go('donnees'),
      goConditions: go('conditions'),
      goMentions: go('mentions'),
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      dropOpen: s.dropOpen,
      dropExpanded: s.dropOpen ? 'true' : 'false',
      dropRot: s.dropOpen ? 'rotate(180deg)' : 'none',
      toggleDrop: () => this.setState({ dropOpen: !s.dropOpen }),
      homeColor: home.color, homeWeight: home.weight, homeDot: home.dot,
      evColor: ev.color, evWeight: ev.weight, evDot: ev.dot,
      prColor: pr.color, prWeight: pr.weight, prDot: pr.dot,
      ctColor: ct.color, ctWeight: ct.weight, ctDot: ct.dot,
      donDot: dn.dot,
      quiColor: qui.color, quiWeight: qui.weight, quiDot: qui.dot,
      equipeColor: equ.color, equipeWeight: equ.weight, equipeDot: equ.dot,
      histoireColor: his.color, histoireWeight: his.weight, histoireDot: his.dot,
      // tall and airy at the top of the page, compact once scrolled
      onScroll: (e) => {
        const vp = e.target, y = vp.scrollTop, next = {};
        if (!sc && y > 60) next.scrolled = true; else if (sc && y < 4) next.scrolled = false;
        if (s.page === 'home') {
          // the section whose top has passed the middle of the screen is the current one
          const top = vp.getBoundingClientRect().top; let cur = 'accueil';
          ['bienvenue', 'evenements', 'predication'].forEach((k) => { const el = vp.querySelector('#home-' + k); if (el && el.getBoundingClientRect().top - top < vp.clientHeight / 2) cur = k; });
          if (cur !== s.anchor) { next.anchor = cur; next.flash = true; clearTimeout(this._flash); this._flash = setTimeout(() => this.setState({ flash: false }), 1600); }
        }
        if (Object.keys(next).length) this.setState(next);
      },
      jumpAccueil: jump('accueil'), aAccueilCur: s.anchor === 'accueil' ? 'true' : 'false', aAccueilH: s.anchor === 'accueil' ? '24px' : '8px', aAccueilBg: s.anchor === 'accueil' ? '[[accent]]' : '[[text-muted]]', aAccueilW: s.anchor === 'accueil' ? '600' : '500', aAccueilC: s.anchor === 'accueil' ? '[[secondary]]' : '[[text]]',
      jumpBienvenue: jump('bienvenue'), aBienvenueCur: s.anchor === 'bienvenue' ? 'true' : 'false', aBienvenueH: s.anchor === 'bienvenue' ? '24px' : '8px', aBienvenueBg: s.anchor === 'bienvenue' ? '[[accent]]' : '[[text-muted]]', aBienvenueW: s.anchor === 'bienvenue' ? '600' : '500', aBienvenueC: s.anchor === 'bienvenue' ? '[[secondary]]' : '[[text]]',
      jumpEvenements: jump('evenements'), aEvenementsCur: s.anchor === 'evenements' ? 'true' : 'false', aEvenementsH: s.anchor === 'evenements' ? '24px' : '8px', aEvenementsBg: s.anchor === 'evenements' ? '[[accent]]' : '[[text-muted]]', aEvenementsW: s.anchor === 'evenements' ? '600' : '500', aEvenementsC: s.anchor === 'evenements' ? '[[secondary]]' : '[[text]]',
      aAccueilOp: s.anchor === 'accueil' && s.flash ? '1' : '0', aAccueilPh: s.anchor === 'accueil' ? '20px' : '8px',
      aBienvenueOp: s.anchor === 'bienvenue' && s.flash ? '1' : '0', aBienvenuePh: s.anchor === 'bienvenue' ? '20px' : '8px',
      aEvenementsOp: s.anchor === 'evenements' && s.flash ? '1' : '0', aEvenementsPh: s.anchor === 'evenements' ? '20px' : '8px',
      aPredicationOp: s.anchor === 'predication' && s.flash ? '1' : '0', aPredicationPh: s.anchor === 'predication' ? '20px' : '8px',
      snapCur: s.anchor, snapClass: s.page === 'home' ? 'snapfx' : '',
      aAccueilVis: s.anchor === 'accueil' ? 'visible' : 'hidden',
      aBienvenueVis: s.anchor === 'bienvenue' ? 'visible' : 'hidden',
      aEvenementsVis: s.anchor === 'evenements' ? 'visible' : 'hidden',
      aPredicationVis: s.anchor === 'predication' ? 'visible' : 'hidden',
      showSheetBtn: s.page === 'home' && (s.scrolled || s.anchor !== 'accueil'),
      anchorLabel: LABELS[s.anchor], sheetOpen: s.sheetOpen, sheetExpanded: s.sheetOpen ? 'true' : 'false',
      toggleSheet: () => this.setState({ sheetOpen: !s.sheetOpen }), closeSheet: () => this.setState({ sheetOpen: false }),
      snapType: 'none',
      aPredicationLabel: live ? 'En ce moment' : 'La dernière prédication',
      jumpPredication: jump('predication'), aPredicationCur: s.anchor === 'predication' ? 'true' : 'false', aPredicationH: s.anchor === 'predication' ? '24px' : '8px', aPredicationBg: s.anchor === 'predication' ? '[[accent]]' : '[[text-muted]]', aPredicationW: s.anchor === 'predication' ? '600' : '500', aPredicationC: s.anchor === 'predication' ? '[[secondary]]' : '[[text]]',
      hdrH: sc ? '67px' : '87px', logoH: sc ? '48px' : '56px', navFs: sc ? '16px' : '18px', navGap: sc ? '32px' : '40px', donH: sc ? '44px' : '52px',
      hdrLine: sc ? '[[border]]' : '[[border]]', hdrShadow: sc ? '0 4px 16px rgba(21, 39, 61, 0.08)' : 'none',
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      churchColor: chu.color, churchWeight: chu.weight, churchDot: chu.dot,
      quiBg: s.page === 'qui' ? '[[surface-mist]]' : 'transparent',
      equipeBg: s.page === 'equipe' ? '[[surface-mist]]' : 'transparent',
      histoireBg: s.page === 'histoire' ? '[[surface-mist]]' : 'transparent',
      setVp: (el) => {
        this.vp = el;
      },
      values: values
    };
  }
}
</script>
</body>
</html>
