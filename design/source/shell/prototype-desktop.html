<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>@@TITLE@@</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style>
body{margin:0;background:[[surface-white]]}
a{color:[[primary]]}a:hover{color:[[primary-hover]]}
a:focus-visible,button:focus-visible{outline:3px solid [[secondary]];outline-offset:3px;border-radius:4px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:[[surface-white]]}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}details[open] .chevron{transform:rotate(180deg)}
h1,h2,h3,h4{font-weight:600;letter-spacing:-0.03em}
.anchor-nav .anchor-label{opacity:0;transition:opacity .15s}.anchor-nav a:hover .anchor-label,.anchor-nav a:focus-visible .anchor-label{opacity:1}
.snapfx #home-accueil>*:not(.anchor-nav),.snapfx #home-bienvenue>*,.snapfx #home-evenements>*,.snapfx #home-predication>*{transition:opacity 1.2s ease .15s;opacity:.15}.snapfx[data-cur="accueil"] #home-accueil>*:not(.anchor-nav),.snapfx[data-cur="bienvenue"] #home-bienvenue>*,.snapfx[data-cur="evenements"] #home-evenements>*,.snapfx[data-cur="predication"] #home-predication>*{opacity:1}@media (prefers-reduced-motion: reduce){.snapfx #home-accueil>*:not(.anchor-nav),.snapfx #home-bienvenue>*,.snapfx #home-evenements>*,.snapfx #home-predication>*{transition:none;opacity:1}}
</style>
</helmet>
<div style="position: relative; width: @@W@@px; height: @@H@@px; overflow: hidden; background: [[surface-white]]">
  <div ref="{{ setVp }}" onScroll="{{ onScroll }}" class="{{ snapClass }}" data-cur="{{ snapCur }}" style="scroll-snap-type: {{ snapType }}; scroll-padding-top: 71px; width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; font-family: 'Inter Tight', system-ui, sans-serif; color: [[text]]; font-size: 18px; line-height: 1.6; background: [[surface-white]]">
  <header style="position: sticky; top: 0; z-index: 20; background: [[surface-white]]; border-bottom: 1px solid {{ hdrLine }}; box-shadow: {{ hdrShadow }}; transition: box-shadow 0.2s">
    <div style="max-width: 1200px; height: {{ hdrH }}; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 32px; transition: height 0.2s">
      <a href="#" onClick="{{ goHome }}" aria-label="Accueil" style="display: block; line-height: 0"><img src="/_blob/513278200da79a2601d13dcd3ae8d93d" alt="Église Évangélique de Valenciennes" style="height: {{ logoH }}; width: auto; transition: height 0.2s"></a>
      <nav aria-label="Menu principal" style="display: flex; align-items: center; gap: {{ navGap }}">
        <a href="#" onClick="{{ goHome }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{ homeColor }}; font-size: {{ navFs }}; font-weight: {{ homeWeight }}; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ homeDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Accueil</a>
        <a href="#" onClick="{{ goEglise }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{ churchColor }}; font-size: {{ navFs }}; font-weight: {{ churchWeight }}; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ churchDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>L'église</a>
        <a href="#" onClick="{{ goEvenements }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{ evColor }}; font-size: {{ navFs }}; font-weight: {{ evWeight }}; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ evDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Évènements</a>
        <a href="#" onClick="{{ goPredications }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{ prColor }}; font-size: {{ navFs }}; font-weight: {{ prWeight }}; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ prDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Prédications</a>
        <a href="#" onClick="{{ goContact }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{ ctColor }}; font-size: {{ navFs }}; font-weight: {{ ctWeight }}; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ ctDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Nous contacter</a>
        <a href="#" onClick="{{ goDon }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: {{ donH }}; padding: 0 20px; border-radius: 4px; background: [[primary]]; color: [[surface-white]]; font-size: {{ navFs }}; font-weight: 700; text-decoration: none"><span aria-hidden="true" style="flex: none; display: {{ donDot }}; width: 6px; height: 6px; border-radius: 999px; background: [[accent]]"></span>Faire un don</a>
      </nav>
    </div>
  </header>
  @@PAGES@@

  </div>
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <nav class="anchor-nav" aria-label="Sections de la page" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-family: 'Inter Tight', system-ui, sans-serif; line-height: 1.6; z-index: 25; display: flex; flex-direction: column; align-items: flex-end">
      <a href="#" onClick="{{ jumpAccueil }}" aria-current="{{ aAccueilCur }}" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 32px; text-decoration: none"><span class="anchor-label" style="padding: 4px 10px; border-radius: 4px; background: [[surface-white]]; box-shadow: 0 2px 8px rgba(21, 39, 61, 0.12); font-size: 14px; font-weight: {{ aAccueilW }}; color: {{ aAccueilC }}; white-space: nowrap">Haut de page</span><span aria-hidden="true" style="display: flex; justify-content: center; width: 24px"><span style="display: block; width: 8px; height: {{ aAccueilH }}; border-radius: 999px; background: {{ aAccueilBg }}"></span></span></a>
      <a href="#" onClick="{{ jumpBienvenue }}" aria-current="{{ aBienvenueCur }}" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 32px; text-decoration: none"><span class="anchor-label" style="padding: 4px 10px; border-radius: 4px; background: [[surface-white]]; box-shadow: 0 2px 8px rgba(21, 39, 61, 0.12); font-size: 14px; font-weight: {{ aBienvenueW }}; color: {{ aBienvenueC }}; white-space: nowrap">Bienvenue</span><span aria-hidden="true" style="display: flex; justify-content: center; width: 24px"><span style="display: block; width: 8px; height: {{ aBienvenueH }}; border-radius: 999px; background: {{ aBienvenueBg }}"></span></span></a>
      <a href="#" onClick="{{ jumpEvenements }}" aria-current="{{ aEvenementsCur }}" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 32px; text-decoration: none"><span class="anchor-label" style="padding: 4px 10px; border-radius: 4px; background: [[surface-white]]; box-shadow: 0 2px 8px rgba(21, 39, 61, 0.12); font-size: 14px; font-weight: {{ aEvenementsW }}; color: {{ aEvenementsC }}; white-space: nowrap">Les évènements</span><span aria-hidden="true" style="display: flex; justify-content: center; width: 24px"><span style="display: block; width: 8px; height: {{ aEvenementsH }}; border-radius: 999px; background: {{ aEvenementsBg }}"></span></span></a>
      <a href="#" onClick="{{ jumpPredication }}" aria-current="{{ aPredicationCur }}" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 32px; text-decoration: none"><span class="anchor-label" style="padding: 4px 10px; border-radius: 4px; background: [[surface-white]]; box-shadow: 0 2px 8px rgba(21, 39, 61, 0.12); font-size: 14px; font-weight: {{ aPredicationW }}; color: {{ aPredicationC }}; white-space: nowrap">{{ aPredicationLabel }}</span><span aria-hidden="true" style="display: flex; justify-content: center; width: 24px"><span style="display: block; width: 8px; height: {{ aPredicationH }}; border-radius: 999px; background: {{ aPredicationBg }}"></span></span></a>
    </nav>
  </sc-if>
  <sc-if value="{{ isEglise }}" hint-placeholder-val="{{ false }}">
    <nav class="anchor-nav" aria-label="Sections de la page" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-family: 'Inter Tight', system-ui, sans-serif; line-height: 1.6; z-index: 25; display: flex; flex-direction: column; align-items: flex-end">
      <sc-for list="{{ churchSections }}" as="d" hint-placeholder-count="5">
      <a href="#" onClick="{{ d.jump }}" aria-current="{{ d.cur }}" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 32px; text-decoration: none"><span class="anchor-label" style="padding: 4px 10px; border-radius: 4px; background: [[surface-white]]; box-shadow: 0 2px 8px rgba(21, 39, 61, 0.12); font-size: 14px; font-weight: {{ d.w }}; color: {{ d.c }}; white-space: nowrap">{{ d.label }}</span><span aria-hidden="true" style="display: flex; justify-content: center; width: 24px"><span style="display: block; width: 8px; height: {{ d.h }}; border-radius: 999px; background: {{ d.bg }}"></span></span></a>
      </sc-for>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sermonBlock":{"editor":"enum","options":["La dernière prédication","En direct (pendant la diffusion YouTube)"],"default":"La dernière prédication","section":"États des pages"},"eventsBlock":{"editor":"enum","options":["Des évènements à venir","Aucun évènement à venir"],"default":"Des évènements à venir","section":"États des pages"},"$preview":{"width":@@W@@,"height":@@H@@}}'>
const VALUES = [{"title": "La Bible, Parole de Dieu", "text": "Dans la Bible, toute entière, comme la Parole inspirée et infaillible de Dieu."}, {"title": "Un seul Dieu, créateur", "text": "Dans le Dieu unique et Éternel, créateur de l'univers et de l'homme."}, {"title": "Jésus-Christ", "text": "En Jésus-Christ, dans sa naissance miraculeuse, dans sa vie sans péché, dans ses miracles, dans sa mort volontaire pour tous les hommes, dans sa résurrection corporelle, dans son ascension à la droite du Père, dans son retour prochain et dans sa divinité."}, {"title": "Le salut par la foi", "text": "Dans la nature pécheresse de l'homme, mais l'accès au Salut et au pardon, en Jésus seul, et par la foi."}, {"title": "La nouvelle naissance", "text": "Dans la nouvelle naissance opérée par le Saint-Esprit : elle conduit les croyants dans un amour plus grand pour Dieu, un attachement à la Bible, et à mener une vie digne de Jésus-Christ."}, {"title": "La guérison divine", "text": "Dans la guérison divine, offerte à travers l'œuvre de Christ à la Croix."}, {"title": "Le baptême et les dons du Saint-Esprit", "text": "Dans le baptême et les dons du Saint-Esprit (la Bible, livre des Actes des Apôtres, chapitre 2, verset 4), donnés aux croyants qui le demandent, dans le but de servir efficacement Dieu et de témoigner de son nom dans notre monde."}, {"title": "L'Église", "text": "Dans l'Église de Jésus-Christ, non comme un bâtiment ou une institution religieuse, mais comme le rassemblement des croyants autour de leur foi et de leur attachement à Jésus."}, {"title": "Le baptême et la Sainte Cène", "text": "Dans la pratique de deux ordonnances chrétiennes : le baptême par immersion des adultes, signe public d'une conversion véritable et d'un engagement envers Jésus ; la Sainte Cène, ou repas du Seigneur, par lequel le croyant commémore la mort de Jésus-Christ, sa victoire absolue sur la mort et son retour prochain."}];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 'home', menuOpen: false, openValue: 0, scrolled: false, anchor: 'accueil', flash: false, sheetOpen: false };
  }
  renderVals() {
    const s = this.state;
    const live = (this.props.sermonBlock ?? 'La dernière prédication') !== 'La dernière prédication';
    const hasEvents = (this.props.eventsBlock ?? 'Des évènements à venir') === 'Des évènements à venir';
    const go = (page) => (e) => {
      if (e && e.preventDefault) e.preventDefault();
      this.setState({ page: page, menuOpen: false, scrolled: false, anchor: page === 'eglise' ? 'vision' : 'accueil', sheetOpen: false });
      if (this.vp) this.vp.scrollTop = 0;
    };
    const on = (pages, active, idle) => pages.indexOf(s.page) >= 0 ? active : idle;
    // current section: night blue, semibold, gold dot before; the others muted
    const sect = (pages) => ({ color: on(pages, '[[secondary]]', '[[text-muted]]'), weight: on(pages, '600', '500'), dot: on(pages, 'inline-block', 'none') });
    const home = sect(['home']), chu = sect(['eglise']);
    const ev = sect(['evenements', 'evenement']), pr = sect(['predications', 'predication']), ct = sect(['contact']), dn = sect(['don']);
    const sc = s.scrolled;
    // smooth scroll to a home section, below the compact header
    // slow eased scroll (1 s); the computer home moves section by section with the wheel
    const HC = 71;
    const target = (k) => { const vp = this.vp, el = vp && vp.querySelector('#' + s.page + '-' + k); return el ? (k === 'accueil' || k === 'vision' ? 0 : el.getBoundingClientRect().top - vp.getBoundingClientRect().top + vp.scrollTop - HC) : null; };
    const glide = (to) => {
      const vp = this.vp; if (!vp) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const from = vp.scrollTop, d = to - from, dur = reduce ? 0 : 1000, t0 = performance.now();
      this._anim = true;
      const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const step = (now) => { const x = dur ? Math.min(1, (now - t0) / dur) : 1; vp.scrollTop = from + d * ease(x); if (x < 1) requestAnimationFrame(step); else { this._anim = false; this._cool = Date.now() + 300; } };
      requestAnimationFrame(step);
    };
    const jump = (k) => (e) => { if (e && e.preventDefault) e.preventDefault(); if (s.sheetOpen) this.setState({ sheetOpen: false }); const t = target(k); if (t !== null) glide(t); };
    const LABELS = { vision: 'Notre vision', valeurs: 'Nos valeurs', 'couple-pastoral': 'Le couple pastoral', departements: 'Les départements', histoire: 'Notre histoire', accueil: 'Haut de page', bienvenue: 'Bienvenue', evenements: 'Les évènements', predication: live ? 'En ce moment' : 'La dernière prédication' };
    const values = VALUES.map((v, i) => ({
      n: i + 1,
      title: v.title,
      text: v.text,
      open: s.openValue === i,
      expanded: s.openValue === i ? 'true' : 'false',
      rot: s.openValue === i ? 'rotate(180deg)' : 'none',
      toggle: () => this.setState({ openValue: s.openValue === i ? -1 : i })
    }));
    return {
      hasEvents: hasEvents, noEvents: !hasEvents, live: live, notLive: !live,
      isHome: s.page === 'home',
      isEglise: s.page === 'eglise',
      isEvenements: s.page === 'evenements',
      isEvenement: s.page === 'evenement',
      isPredications: s.page === 'predications',
      isPredication: s.page === 'predication',
      isContact: s.page === 'contact',
      isDon: s.page === 'don',
      isEntretien: s.page === 'entretien',
      isPriere: s.page === 'priere',
      isServir: s.page === 'servir',
      isDonnees: s.page === 'donnees',
      isConditions: s.page === 'conditions',
      isMentions: s.page === 'mentions',
      goHome: go('home'),
      goEglise: go('eglise'),
      goEvenements: go('evenements'),
      goEvenement: go('evenement'),
      goPredications: go('predications'),
      goPredication: go('predication'),
      goContact: go('contact'),
      goDon: go('don'),
      goEntretien: go('entretien'),
      goPriere: go('priere'),
      goServir: go('servir'),
      goDonnees: go('donnees'),
      goConditions: go('conditions'),
      goMentions: go('mentions'),
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      homeColor: home.color, homeWeight: home.weight, homeDot: home.dot,
      evColor: ev.color, evWeight: ev.weight, evDot: ev.dot,
      prColor: pr.color, prWeight: pr.weight, prDot: pr.dot,
      ctColor: ct.color, ctWeight: ct.weight, ctDot: ct.dot,
      donDot: dn.dot,
      // tall and airy at the top of the page, compact once scrolled
      onScroll: (e) => {
        const vp = e.target, y = vp.scrollTop, next = {};
        if (!sc && y > 60) next.scrolled = true; else if (sc && y < 4) next.scrolled = false;
        const anchors = s.page === 'home' ? ['bienvenue', 'evenements', 'predication'] : s.page === 'eglise' ? ['valeurs', 'couple-pastoral', 'departements', 'histoire'] : null;
        if (anchors) {
          // the section whose top has passed the middle of the screen is the current one
          const top = vp.getBoundingClientRect().top; let cur = s.page === 'home' ? 'accueil' : 'vision';
          anchors.forEach((k) => { const el = vp.querySelector('#' + s.page + '-' + k); if (el && el.getBoundingClientRect().top - top < vp.clientHeight / 2) cur = k; });
          if (cur !== s.anchor) { next.anchor = cur; next.flash = true; clearTimeout(this._flash); this._flash = setTimeout(() => this.setState({ flash: false }), 1600); }
        }
        if (Object.keys(next).length) this.setState(next);
      },
      jumpAccueil: jump('accueil'), aAccueilCur: s.anchor === 'accueil' ? 'true' : 'false', aAccueilH: s.anchor === 'accueil' ? '24px' : '8px', aAccueilBg: s.anchor === 'accueil' ? '[[accent]]' : '[[text-muted]]', aAccueilW: s.anchor === 'accueil' ? '600' : '500', aAccueilC: s.anchor === 'accueil' ? '[[secondary]]' : '[[text]]',
      jumpBienvenue: jump('bienvenue'), aBienvenueCur: s.anchor === 'bienvenue' ? 'true' : 'false', aBienvenueH: s.anchor === 'bienvenue' ? '24px' : '8px', aBienvenueBg: s.anchor === 'bienvenue' ? '[[accent]]' : '[[text-muted]]', aBienvenueW: s.anchor === 'bienvenue' ? '600' : '500', aBienvenueC: s.anchor === 'bienvenue' ? '[[secondary]]' : '[[text]]',
      jumpEvenements: jump('evenements'), aEvenementsCur: s.anchor === 'evenements' ? 'true' : 'false', aEvenementsH: s.anchor === 'evenements' ? '24px' : '8px', aEvenementsBg: s.anchor === 'evenements' ? '[[accent]]' : '[[text-muted]]', aEvenementsW: s.anchor === 'evenements' ? '600' : '500', aEvenementsC: s.anchor === 'evenements' ? '[[secondary]]' : '[[text]]',
      aAccueilOp: s.anchor === 'accueil' && s.flash ? '1' : '0', aAccueilPh: s.anchor === 'accueil' ? '20px' : '8px',
      aBienvenueOp: s.anchor === 'bienvenue' && s.flash ? '1' : '0', aBienvenuePh: s.anchor === 'bienvenue' ? '20px' : '8px',
      aEvenementsOp: s.anchor === 'evenements' && s.flash ? '1' : '0', aEvenementsPh: s.anchor === 'evenements' ? '20px' : '8px',
      aPredicationOp: s.anchor === 'predication' && s.flash ? '1' : '0', aPredicationPh: s.anchor === 'predication' ? '20px' : '8px',
      snapCur: s.anchor, snapClass: s.page === 'home' ? 'snapfx' : '',
      aAccueilVis: s.anchor === 'accueil' ? 'visible' : 'hidden',
      aBienvenueVis: s.anchor === 'bienvenue' ? 'visible' : 'hidden',
      aEvenementsVis: s.anchor === 'evenements' ? 'visible' : 'hidden',
      aPredicationVis: s.anchor === 'predication' ? 'visible' : 'hidden',
      showSheetBtn: (s.page === 'home' && (s.scrolled || s.anchor !== 'accueil')) || (s.page === 'eglise' && s.scrolled),
      anchorLabel: LABELS[s.anchor], sheetOpen: s.sheetOpen, sheetExpanded: s.sheetOpen ? 'true' : 'false',
      toggleSheet: () => this.setState({ sheetOpen: !s.sheetOpen }), closeSheet: () => this.setState({ sheetOpen: false }),
      snapType: 'none',
      aPredicationLabel: live ? 'En ce moment' : 'La dernière prédication',
      jumpPredication: jump('predication'), aPredicationCur: s.anchor === 'predication' ? 'true' : 'false', aPredicationH: s.anchor === 'predication' ? '24px' : '8px', aPredicationBg: s.anchor === 'predication' ? '[[accent]]' : '[[text-muted]]', aPredicationW: s.anchor === 'predication' ? '600' : '500', aPredicationC: s.anchor === 'predication' ? '[[secondary]]' : '[[text]]',
      hdrH: sc ? '71px' : '119px', logoH: sc ? '44px' : '72px', navFs: sc ? '16px' : '18px', navGap: sc ? '32px' : '40px', donH: sc ? '44px' : '52px',
      hdrLine: sc ? '[[border]]' : 'transparent', hdrShadow: sc ? '0 4px 16px rgba(21, 39, 61, 0.08)' : 'none',
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      churchColor: chu.color, churchWeight: chu.weight, churchDot: chu.dot,
      setVp: (el) => {
        this.vp = el;
        if (el && !el._wheel) {
          el._wheel = true;
          el.addEventListener('wheel', (e) => {
            if (this.state.page !== 'home') return;
            e.preventDefault();
            if (this._anim || Date.now() < (this._cool || 0) || Math.abs(e.deltaY) < 4) return;
            const stops = [0].concat(['bienvenue', 'evenements', 'predication'].map((k) => target(k)).filter((v) => v !== null), [el.scrollHeight - el.clientHeight]);
            const y = el.scrollTop;
            const next = e.deltaY > 0 ? stops.find((v) => v > y + 2) : stops.slice().reverse().find((v) => v < y - 2);
            if (next !== undefined) glide(next);
          }, { passive: false });
        }
      },
      churchSections: [ ["vision", "Notre vision"], ["valeurs", "Nos valeurs"], ["couple-pastoral", "Le couple pastoral"], ["departements", "Les départements"], ["histoire", "Notre histoire"]].map(([k, label]) => { const on = s.anchor === k; return { label: label, jump: jump(k), cur: on ? 'true' : 'false', h: on ? '24px' : '8px', bg: on ? '[[accent]]' : '[[text-muted]]', w: on ? '600' : '500', c: on ? '[[secondary]]' : '[[text]]', vis: on ? 'visible' : 'hidden', op: on && s.flash ? '1' : '0', ph: on ? '20px' : '8px' }; }),
      values: values
    };
  }
}
</script>
</body>
</html>
