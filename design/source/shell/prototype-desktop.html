<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>@@TITLE@@</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style>
body{margin:0;background:[[surface-white]]}
a{color:[[primary]]}a:hover{color:[[primary-hover]]}
a:focus-visible,button:focus-visible{outline:3px solid [[secondary]];outline-offset:3px;border-radius:4px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:[[surface-white]]}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}details[open] .chevron{transform:rotate(180deg)}
h1,h2,h3,h4{font-weight:600;letter-spacing:-0.03em}
</style>
</helmet>
<div style="position: relative; width: @@W@@px; height: @@H@@px; overflow: hidden; background: [[surface-white]]">
  <div ref="{{ setVp }}" style="width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; font-family: 'Inter Tight', system-ui, sans-serif; color: [[text]]; font-size: 18px; line-height: 1.6; background: [[surface-white]]">
  <header style="background: [[surface-white]]; border-bottom: 1px solid [[border]]; position: relative; z-index: 20">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="#" onClick="{{ goHome }}" aria-label="Accueil" style="display: block; line-height: 0"><img src="/_blob/513278200da79a2601d13dcd3ae8d93d" alt="Église Évangélique de Valenciennes" style="height: 56px; width: auto"></a>
      <nav aria-label="Menu principal" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: [[surface-white]]; border-radius: 6px; padding: 8px">
        <a href="#" onClick="{{ goHome }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; text-decoration: none; background: {{ homeBg }}; color: {{ homeColor }}; font-weight: {{ homeWeight }}">Accueil</a>
        <div style="position: relative">
          <button type="button" aria-expanded="{{ dropExpanded }}" onClick="{{ toggleDrop }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 4px; cursor: pointer; font: inherit; background: {{ churchBg }}; color: {{ churchColor }}; font-weight: {{ churchWeight }}">L'église<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{ dropRot }}"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
          <sc-if value="{{ dropOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% + 16px); left: 0; z-index: 30; min-width: 240px; padding: 8px; background: [[surface-white]]; border: 1px solid [[border]]; border-radius: 6px">
              <a href="#" onClick="{{ goQui }}" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; color: [[secondary]]; text-decoration: none; background: {{ quiBg }}">Qui sommes-nous ?</a>
              <a href="#" onClick="{{ goEquipe }}" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; color: [[secondary]]; text-decoration: none; background: {{ equipeBg }}">L'équipe</a>
              <a href="#" onClick="{{ goHistoire }}" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; color: [[secondary]]; text-decoration: none; background: {{ histoireBg }}">Notre histoire</a>
            </div>
          </sc-if>
        </div>
        <a href="#" onClick="{{ goEvenements }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; text-decoration: none; background: {{ evBg }}; color: {{ evColor }}; font-weight: {{ evWeight }}">Évènements</a>
        <a href="#" onClick="{{ goPredications }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; text-decoration: none; background: {{ prBg }}; color: {{ prColor }}; font-weight: {{ prWeight }}">Prédications</a>
        <a href="#" onClick="{{ goContact }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; text-decoration: none; background: {{ ctBg }}; color: {{ ctColor }}; font-weight: {{ ctWeight }}">Nous contacter</a>
        <a href="#" onClick="{{ goDon }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 4px; background: {{ donBg }}; color: [[surface-white]]; font-weight: 600; text-decoration: none">Faire un don</a>
      </nav>
    </div>
  </header>
  @@PAGES@@

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sermonBlock":{"editor":"enum","options":["La dernière prédication","En direct (pendant la diffusion YouTube)"],"default":"La dernière prédication","section":"États des pages"},"eventsBlock":{"editor":"enum","options":["Des évènements à venir","Aucun évènement à venir"],"default":"Des évènements à venir","section":"États des pages"},"$preview":{"width":@@W@@,"height":@@H@@}}'>
const VALUES = [{"title": "La Bible, Parole de Dieu", "text": "Dans la Bible, toute entière, comme la Parole inspirée et infaillible de Dieu."}, {"title": "Un seul Dieu, créateur", "text": "Dans le Dieu unique et Éternel, créateur de l'univers et de l'homme."}, {"title": "Jésus-Christ", "text": "En Jésus-Christ, dans sa naissance miraculeuse, dans sa vie sans péché, dans ses miracles, dans sa mort volontaire pour tous les hommes, dans sa résurrection corporelle, dans son ascension à la droite du Père, dans son retour prochain et dans sa divinité."}, {"title": "Le salut par la foi", "text": "Dans la nature pécheresse de l'homme, mais l'accès au Salut et au pardon, en Jésus seul, et par la foi."}, {"title": "La nouvelle naissance", "text": "Dans la nouvelle naissance opérée par le Saint-Esprit : elle conduit les croyants dans un amour plus grand pour Dieu, un attachement à la Bible, et à mener une vie digne de Jésus-Christ."}, {"title": "La guérison divine", "text": "Dans la guérison divine, offerte à travers l'œuvre de Christ à la Croix."}, {"title": "Le baptême et les dons du Saint-Esprit", "text": "Dans le baptême et les dons du Saint-Esprit (la Bible, livre des Actes des Apôtres, chapitre 2, verset 4), donnés aux croyants qui le demandent, dans le but de servir efficacement Dieu et de témoigner de son nom dans notre monde."}, {"title": "L'Église", "text": "Dans l'Église de Jésus-Christ, non comme un bâtiment ou une institution religieuse, mais comme le rassemblement des croyants autour de leur foi et de leur attachement à Jésus."}, {"title": "Le baptême et la Sainte Cène", "text": "Dans la pratique de deux ordonnances chrétiennes : le baptême par immersion des adultes, signe public d'une conversion véritable et d'un engagement envers Jésus ; la Sainte Cène, ou repas du Seigneur, par lequel le croyant commémore la mort de Jésus-Christ, sa victoire absolue sur la mort et son retour prochain."}];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 'home', menuOpen: false, dropOpen: false, openValue: 0 };
  }
  renderVals() {
    const s = this.state;
    const live = (this.props.sermonBlock ?? 'La dernière prédication') !== 'La dernière prédication';
    const hasEvents = (this.props.eventsBlock ?? 'Des évènements à venir') === 'Des évènements à venir';
    const go = (page) => (e) => {
      if (e && e.preventDefault) e.preventDefault();
      this.setState({ page: page, menuOpen: false, dropOpen: false });
      if (this.vp) this.vp.scrollTop = 0;
    };
    const church = ['qui', 'equipe', 'histoire'].indexOf(s.page) >= 0;
    const on = (pages, active, idle) => pages.indexOf(s.page) >= 0 ? active : idle;
    const sect = (pages) => ({ bg: on(pages, '[[secondary]]', 'transparent'), color: on(pages, '[[surface-white]]', '[[secondary]]'), weight: on(pages, '600', '400') });
    const ev = sect(['evenements', 'evenement']), pr = sect(['predications', 'predication']), ct = sect(['contact']);
    const values = VALUES.map((v, i) => ({
      n: i + 1,
      title: v.title,
      text: v.text,
      open: s.openValue === i,
      expanded: s.openValue === i ? 'true' : 'false',
      rot: s.openValue === i ? 'rotate(180deg)' : 'none',
      toggle: () => this.setState({ openValue: s.openValue === i ? -1 : i })
    }));
    return {
      hasEvents: hasEvents, noEvents: !hasEvents, live: live, notLive: !live,
      isHome: s.page === 'home',
      isQui: s.page === 'qui',
      isEquipe: s.page === 'equipe',
      isHistoire: s.page === 'histoire',
      isEvenements: s.page === 'evenements',
      isEvenement: s.page === 'evenement',
      isPredications: s.page === 'predications',
      isPredication: s.page === 'predication',
      isContact: s.page === 'contact',
      isDon: s.page === 'don',
      isEntretien: s.page === 'entretien',
      isPriere: s.page === 'priere',
      isServir: s.page === 'servir',
      isDonnees: s.page === 'donnees',
      isConditions: s.page === 'conditions',
      isMentions: s.page === 'mentions',
      goHome: go('home'),
      goQui: go('qui'),
      goEquipe: go('equipe'),
      goHistoire: go('histoire'),
      goEvenements: go('evenements'),
      goEvenement: go('evenement'),
      goPredications: go('predications'),
      goPredication: go('predication'),
      goContact: go('contact'),
      goDon: go('don'),
      goEntretien: go('entretien'),
      goPriere: go('priere'),
      goServir: go('servir'),
      goDonnees: go('donnees'),
      goConditions: go('conditions'),
      goMentions: go('mentions'),
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      dropOpen: s.dropOpen,
      dropExpanded: s.dropOpen ? 'true' : 'false',
      dropRot: s.dropOpen ? 'rotate(180deg)' : 'none',
      toggleDrop: () => this.setState({ dropOpen: !s.dropOpen }),
      homeBg: on(['home'], '[[secondary]]', 'transparent'),
      homeColor: on(['home'], '[[surface-white]]', '[[secondary]]'),
      homeWeight: on(['home'], '600', '400'),
      evBg: ev.bg, evColor: ev.color, evWeight: ev.weight,
      prBg: pr.bg, prColor: pr.color, prWeight: pr.weight,
      ctBg: ct.bg, ctColor: ct.color, ctWeight: ct.weight,
      donBg: on(['don'], '[[secondary]]', '[[primary]]'),
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      churchBg: church ? '[[secondary]]' : 'transparent',
      churchColor: church ? '[[surface-white]]' : '[[secondary]]',
      churchWeight: church ? '600' : '400',
      quiBg: s.page === 'qui' ? '[[surface-mist]]' : 'transparent',
      equipeBg: s.page === 'equipe' ? '[[surface-mist]]' : 'transparent',
      histoireBg: s.page === 'histoire' ? '[[surface-mist]]' : 'transparent',
      setVp: (el) => { this.vp = el; },
      values: values
    };
  }
}
</script>
</body>
</html>
